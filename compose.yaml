name: aster-risk
services:
  worker-a:
    build: .
    command: [worker, --listen, '0.0.0.0:7401', --threads, '2']
    environment:
      ASTER_KEY: '${ASTER_KEY:?Create .env with ASTER_KEY of at least 24 characters}'
    restart: unless-stopped
  worker-b:
    build: .
    command: [worker, --listen, '0.0.0.0:7402', --threads, '2']
    environment:
      ASTER_KEY: '${ASTER_KEY:?Create .env with ASTER_KEY of at least 24 characters}'
    restart: unless-stopped
  master:
    build: .
    command: [master, --listen, '0.0.0.0:7400', --workers, 'worker-a:7401,worker-b:7402', --data, /data]
    environment:
      ASTER_KEY: '${ASTER_KEY:?Create .env with ASTER_KEY of at least 24 characters}'
    volumes: [aster-data:/data]
    # Первичный именованный том принадлежит root; master остаётся внутри контейнера.
    user: '0:0'
    depends_on: [worker-a, worker-b]
    restart: unless-stopped
  web:
    build: .
    command: [web, --url, 'http://*:8093/', --master, 'master:7400']
    environment:
      ASTER_KEY: '${ASTER_KEY:?Create .env with ASTER_KEY of at least 24 characters}'
    ports: ['127.0.0.1:${ASTER_WEB_PORT:-8093}:8093']
    depends_on: [master]
    restart: unless-stopped
volumes:
  aster-data:
